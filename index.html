<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🚌 실시간 버스 도착정보</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

    :root {
      --bg: #0a0f1e;
      --surface: #111827;
      --surface2: #1a2235;
      --accent: #3b82f6;
      --accent2: #06b6d4;
      --green: #10b981;
      --yellow: #f59e0b;
      --red: #ef4444;
      --text: #f1f5f9;
      --muted: #64748b;
      --border: #1e293b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      padding: 0 0 60px 0;
    }

    /* 헤더 */
    header {
      background: linear-gradient(135deg, #0d1b3e 0%, #0a0f1e 100%);
      border-bottom: 1px solid var(--border);
      padding: 28px 24px 22px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      top: -60px; left: 50%; transform: translateX(-50%);
      width: 500px; height: 200px;
      background: radial-gradient(ellipse, rgba(59,130,246,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    header h1 {
      font-size: 1.9rem; font-weight: 900;
      background: linear-gradient(90deg, #60a5fa, #22d3ee);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    header p {
      margin-top: 6px; color: var(--muted); font-size: 0.82rem;
    }
    .badge {
      display: inline-block; margin-top: 10px;
      background: rgba(59,130,246,0.12); border: 1px solid rgba(59,130,246,0.3);
      color: #93c5fd; font-size: 0.72rem; padding: 3px 10px; border-radius: 20px;
    }

    /* 검색 박스 */
    .search-box {
      max-width: 640px; margin: 28px auto 0;
      padding: 0 20px;
    }
    .input-row {
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .input-group {
      display: flex; flex-direction: column; gap: 5px;
    }
    .input-group label {
      font-size: 0.75rem; color: var(--muted); font-weight: 600; letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    select, input[type="text"] {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    select:focus, input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    select { width: 130px; cursor: pointer; }
    input[type="text"] { flex: 1; min-width: 160px; }

    .btn-search {
      align-self: flex-end;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      color: white; border: none; padding: 11px 22px;
      border-radius: 10px; font-size: 0.9rem; font-weight: 700;
      cursor: pointer; white-space: nowrap;
      font-family: inherit;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-search:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-search:active { transform: translateY(0); }

    /* 정류소 선택 목록 */
    #station-list {
      max-width: 640px; margin: 16px auto 0; padding: 0 20px;
      display: none;
    }
    #station-list h3 {
      font-size: 0.78rem; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.06em; margin-bottom: 8px; font-weight: 600;
    }
    .station-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 16px;
      margin-bottom: 8px; cursor: pointer;
      display: flex; align-items: center; gap: 12px;
      transition: border-color 0.2s, background 0.2s;
    }
    .station-item:hover {
      border-color: var(--accent);
      background: var(--surface2);
    }
    .station-icon {
      width: 36px; height: 36px; background: rgba(59,130,246,0.15);
      border-radius: 8px; display: flex; align-items: center;
      justify-content: center; font-size: 1.1rem; flex-shrink: 0;
    }
    .station-name { font-weight: 600; font-size: 0.95rem; }
    .station-id { font-size: 0.75rem; color: var(--muted); margin-top: 2px; font-family: 'JetBrains Mono', monospace; }

    /* 도착정보 결과 */
    #result-section {
      max-width: 720px; margin: 24px auto 0; padding: 0 20px;
      display: none;
    }
    .result-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
    }
    .result-title {
      font-size: 1.1rem; font-weight: 700;
    }
    .result-title span { color: var(--accent2); }
    .refresh-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted); padding: 7px 14px;
      border-radius: 8px; cursor: pointer; font-size: 0.8rem;
      font-family: inherit;
      display: flex; align-items: center; gap: 6px;
      transition: color 0.2s, border-color 0.2s;
    }
    .refresh-btn:hover { color: var(--text); border-color: var(--accent); }

    /* 버스 카드 */
    .bus-cards { display: flex; flex-direction: column; gap: 10px; }
    .bus-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
      display: flex; align-items: center; gap: 16px;
      animation: fadeUp 0.35s ease forwards;
      opacity: 0; transform: translateY(12px);
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    .bus-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.3rem; font-weight: 700;
      min-width: 70px; text-align: center;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .bus-info { flex: 1; }
    .bus-dest { font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
    .bus-time-bar {
      display: flex; align-items: center; gap: 8px;
    }
    .bus-time {
      font-size: 1.05rem; font-weight: 700;
    }
    .bus-time.soon { color: var(--red); }
    .bus-time.medium { color: var(--yellow); }
    .bus-time.far { color: var(--green); }
    .bus-stops {
      font-size: 0.78rem; color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }
    .dot {
      display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; flex-shrink: 0;
    }
    .dot.soon { background: var(--red); box-shadow: 0 0 6px var(--red); }
    .dot.medium { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
    .dot.far { background: var(--green); box-shadow: 0 0 6px var(--green); }

    /* 상태 메시지 */
    .status-msg {
      max-width: 640px; margin: 30px auto; padding: 0 20px;
      text-align: center;
    }
    .status-msg .icon { font-size: 2.5rem; margin-bottom: 10px; }
    .status-msg p { color: var(--muted); font-size: 0.9rem; }

    /* 로딩 */
    .loading {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; color: var(--muted); font-size: 0.88rem; padding: 30px 0;
    }
    .spinner {
      width: 18px; height: 18px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 업데이트 시간 */
    .update-time {
      font-size: 0.75rem; color: var(--muted);
      text-align: right; margin-top: 12px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* 오류 박스 */
    .error-box {
      background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25);
      border-radius: 12px; padding: 16px 20px; color: #fca5a5;
      font-size: 0.88rem; line-height: 1.6;
      max-width: 640px; margin: 20px auto; padding-left: 40px;
    }
    .error-box::before { content: '⚠️ '; margin-left: -24px; }

    /* 안내 */
    .info-note {
      max-width: 640px; margin: 18px auto 0; padding: 0 20px;
      background: rgba(6,182,212,0.07); border: 1px solid rgba(6,182,212,0.2);
      border-radius: 10px; padding: 12px 16px;
      font-size: 0.8rem; color: #67e8f9; line-height: 1.6;
    }

    footer {
      text-align: center; color: var(--muted); font-size: 0.75rem;
      margin-top: 50px; padding: 0 20px;
    }
  </style>
</head>
<body>

<header>
  <h1>🚌 실시간 버스 도착정보</h1>
  <p>공공데이터포털 국토교통부 버스도착정보 API 활용</p>
  <span class="badge">정보 교과 수행평가 프로젝트 · 2026</span>
</header>

<!-- 검색 -->
<div class="search-box">
  <div class="input-row">
    <div class="input-group">
      <label>도시 선택</label>
      <select id="city-select">
        <option value="25">서울</option>
        <option value="38">부산</option>
        <option value="22">대구</option>
        <option value="30">인천</option>
        <option value="29">광주</option>
        <option value="27">대전</option>
        <option value="31">울산</option>
        <option value="36">세종</option>
        <option value="41">경기</option>
        <option value="43">충북</option>
        <option value="44">충남</option>
        <option value="45">전북</option>
        <option value="46">전남</option>
        <option value="47">경북</option>
        <option value="48">경남</option>
        <option value="50">제주</option>
      </select>
    </div>
    <div class="input-group" style="flex:1">
      <label>정류소 검색</label>
      <input type="text" id="station-input" placeholder="예: 강남역, 서울역, 홍대입구" />
    </div>
    <button class="btn-search" onclick="searchStation()">🔍 검색</button>
  </div>
</div>

<!-- 안내 메모 -->
<div class="info-note" id="info-note">
  ℹ️ 도시를 선택하고 정류소 이름으로 검색하세요. 검색 결과에서 정류소를 클릭하면 실시간 버스 도착정보를 조회합니다.<br>
  ※ 공공데이터포털 API 특성상 데이터가 없는 지역도 있을 수 있습니다.
</div>

<!-- 정류소 목록 -->
<div id="station-list">
  <h3>검색된 정류소 목록</h3>
  <div id="station-items"></div>
</div>

<!-- 도착정보 결과 -->
<div id="result-section">
  <div class="result-header">
    <div class="result-title">🚏 <span id="selected-station-name"></span></div>
    <button class="refresh-btn" onclick="refreshArrival()">🔄 새로고침</button>
  </div>
  <div id="bus-cards-container"></div>
  <div class="update-time" id="update-time"></div>
</div>

<footer>
  <p>공공데이터포털(data.go.kr) 국토교통부 버스도착정보조회서비스 API 활용</p>
  <p style="margin-top:4px">정보 교과 5월 수행평가 프로젝트 · 김인수</p>
</footer>

<script>
  // ========== 설정 ==========
  const API_KEY = "12d58f38afab181ee27e3d1f1cb83b44e01fdede2b000778d197488640d1c6a9";
  const BASE_URL = "https://apis.data.go.kr/1613000/ArvlInfoInqireService";

  // CORS 우회: 공공데이터포털은 직접 브라우저 호출 시 CORS 오류가 날 수 있음
  // → 아래는 cors-anywhere 프록시 또는 직접 호출 방식 사용
  // GitHub Pages 배포 시 백엔드 없이 직접 호출 시도

  let selectedNodeId = "";
  let selectedNodeNm = "";
  let selectedCityCode = "";

  // Enter 키 지원
  document.getElementById("station-input").addEventListener("keydown", e => {
    if (e.key === "Enter") searchStation();
  });

  // ========== 정류소 검색 ==========
  async function searchStation() {
    const cityCode = document.getElementById("city-select").value;
    const nodeNm = document.getElementById("station-input").value.trim();
    if (!nodeNm) { alert("정류소명을 입력하세요."); return; }

    document.getElementById("info-note").style.display = "none";
    document.getElementById("result-section").style.display = "none";
    document.getElementById("station-list").style.display = "block";
    document.getElementById("station-items").innerHTML =
      `<div class="loading"><div class="spinner"></div> 정류소 검색 중...</div>`;

    const url = `${BASE_URL}/getSttnNoList?serviceKey=${encodeURIComponent(API_KEY)}&pageNo=1&numOfRows=10&cityCode=${cityCode}&nodeNm=${encodeURIComponent(nodeNm)}&_type=json`;

    try {
      const res = await fetch(url);
      const data = await res.json();
      const body = data?.response?.body;

      if (!body || body.totalCount === 0) {
        document.getElementById("station-items").innerHTML =
          `<div class="status-msg"><div class="icon">🔍</div><p>'${nodeNm}'에 해당하는 정류소를 찾을 수 없습니다.<br>다른 이름으로 검색해보세요.</p></div>`;
        return;
      }

      let items = body.items.item;
      if (!Array.isArray(items)) items = [items];

      selectedCityCode = cityCode;
      renderStationList(items);

    } catch (err) {
      document.getElementById("station-items").innerHTML =
        `<div class="error-box">API 호출 오류가 발생했습니다.<br><strong>오류:</strong> ${err.message}<br>
        브라우저 CORS 정책으로 직접 호출이 차단될 수 있습니다. GitHub Pages 배포 또는 로컬 서버에서 실행하세요.</div>`;
    }
  }

  // ========== 정류소 목록 렌더링 ==========
  function renderStationList(items) {
    const container = document.getElementById("station-items");
    container.innerHTML = "";
    items.forEach(item => {
      const div = document.createElement("div");
      div.className = "station-item";
      div.innerHTML = `
        <div class="station-icon">🚏</div>
        <div>
          <div class="station-name">${item.nodenm}</div>
          <div class="station-id">ID: ${item.nodeid}</div>
        </div>
      `;
      div.onclick = () => {
        selectedNodeId = item.nodeid;
        selectedNodeNm = item.nodenm;
        loadArrivalInfo();
      };
      container.appendChild(div);
    });
  }

  // ========== 도착정보 조회 ==========
  async function loadArrivalInfo() {
    document.getElementById("result-section").style.display = "block";
    document.getElementById("selected-station-name").textContent = selectedNodeNm;
    document.getElementById("bus-cards-container").innerHTML =
      `<div class="loading"><div class="spinner"></div> 도착정보 불러오는 중...</div>`;
    document.getElementById("update-time").textContent = "";

    const url = `${BASE_URL}/getSttnAcctoArvlPrearngeInfoList?serviceKey=${encodeURIComponent(API_KEY)}&pageNo=1&numOfRows=20&cityCode=${selectedCityCode}&nodeId=${encodeURIComponent(selectedNodeId)}&_type=json`;

    try {
      const res = await fetch(url);
      const data = await res.json();
      const body = data?.response?.body;

      if (!body || body.totalCount === 0) {
        document.getElementById("bus-cards-container").innerHTML =
          `<div class="status-msg"><div class="icon">🚌</div><p>현재 도착 예정인 버스가 없습니다.</p></div>`;
        return;
      }

      let items = body.items.item;
      if (!Array.isArray(items)) items = [items];

      renderBusCards(items);
      const now = new Date();
      document.getElementById("update-time").textContent =
        `마지막 업데이트: ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;

    } catch (err) {
      document.getElementById("bus-cards-container").innerHTML =
        `<div class="error-box">도착정보 조회 오류: ${err.message}</div>`;
    }
  }

  // ========== 버스 카드 렌더링 ==========
  function renderBusCards(items) {
    const container = document.getElementById("bus-cards-container");
    container.innerHTML = `<div class="bus-cards" id="bus-cards"></div>`;
    const cardsEl = document.getElementById("bus-cards");

    items.sort((a, b) => (a.arrtime || 9999) - (b.arrtime || 9999));

    items.forEach((item, idx) => {
      const routeno = item.routeno || "-";
      const arrtime = parseInt(item.arrtime) || 0;
      const stops = parseInt(item.arrprevstationcnt) || 0;
      const dest = item.nodenm || "-";

      const minutes = Math.floor(arrtime / 60);
      const seconds = arrtime % 60;
      let timeStr, cls;

      if (arrtime <= 60) { timeStr = "곧 도착"; cls = "soon"; }
      else if (minutes < 5) { timeStr = `${minutes}분 ${seconds}초`; cls = "soon"; }
      else if (minutes < 10) { timeStr = `${minutes}분 ${seconds}초`; cls = "medium"; }
      else { timeStr = `${minutes}분 ${seconds}초`; cls = "far"; }

      const card = document.createElement("div");
      card.className = "bus-card";
      card.style.animationDelay = `${idx * 60}ms`;
      card.innerHTML = `
        <div class="bus-number">${routeno}</div>
        <div class="bus-info">
          <div class="bus-dest">행선지: ${dest}</div>
          <div class="bus-time-bar">
            <span class="dot ${cls}"></span>
            <span class="bus-time ${cls}">${timeStr}</span>
            <span class="bus-stops">· 앞 ${stops}개 정류장</span>
          </div>
        </div>
      `;
      cardsEl.appendChild(card);
    });
  }

  function refreshArrival() {
    if (selectedNodeId) loadArrivalInfo();
  }
</script>
</body>
</html>
